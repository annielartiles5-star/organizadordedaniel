<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Pro - Black Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --accent: #ffffff;
            --text: #ffffff;
            --muted: #888888;
            --input: #1e1e1e;
            --border: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 600px; }

        /* Estilos del Calendario Modal */
        #calendar-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .cal-day {
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
        }

        .cal-day:hover { background: var(--input); }
        .cal-day.active { background: var(--accent); color: black; font-weight: bold; }
        .cal-day.other-month { color: #333; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }

        /* Interfaz Principal */
        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h2 { font-weight: 400; font-size: 1.2rem; margin-top: 0; }

        .btn-calendar-trigger {
            width: 100%;
            padding: 15px;
            background: var(--input);
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label { font-size: 11px; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 5px; }

        input {
            width: 100%;
            padding: 12px;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .search-bar {
            margin-bottom: 15px;
            background: var(--input);
            border: none;
            padding: 10px 15px;
            font-size: 14px;
        }

        .btn-save {
            background: var(--accent);
            color: black;
            font-weight: bold;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .total-row { font-weight: bold; font-size: 1.5rem; text-align: center; padding: 20px; }

        select { background: var(--input); color: white; border: 1px solid var(--border); padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeCalendar()"></div>

<div class="container">
    <div class="card">
        <h2>Panel de Control</h2>
        
        <div class="btn-calendar-trigger" onclick="openCalendar()">
            <span id="selected-date-display">Seleccionar Fecha</span>
            <span>📅</span>
        </div>

        <div class="grid-inputs">
            <div><label>Nativos</label><input type="number" id="nativos" value="0" oninput="calc()"></div>
            <div><label>Brasileros</label><input type="number" id="brasileros" value="0" oninput="calc()"></div>
            <div><label>Zoom</label><input type="number" id="zoom" value="0" oninput="calc()"></div>
        </div>

        <div class="total-row" id="total-val">0</div>
        <button class="btn-save" onclick="save()">GUARDAR REGISTRO</button>
    </div>

    <div class="card">
        <label>Buscar en historial</label>
        <input type="text" id="search" class="search-bar" placeholder="Escribe una fecha (AAAA-MM-DD)..." oninput="renderAll()">
        
        <div style="height: 200px;">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>Historial Pasado</h2>
        <table id="historyTable">
            <thead><tr><th>Fecha</th><th>Total</th><th>Acción</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="calendar-modal">
    <div class="calendar-header">
        <select id="cal-month" onchange="buildCalendar()"></select>
        <select id="cal-year" onchange="buildCalendar()"></select>
        <button onclick="closeCalendar()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
    </div>
    <div class="calendar-grid" id="calendar-days"></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('stats_v3')) || {};
    let selectedDate = new Date().toISOString().split('T')[0];
    let chart;

    // Inicializar selectores de calendario
    const months = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
    const monthSelect = document.getElementById('cal-month');
    const yearSelect = document.getElementById('cal-year');

    months.forEach((m, i) => monthSelect.innerHTML += `<option value="${i}">${m}</option>`);
    for(let y=2024; y<=3030; y++) yearSelect.innerHTML += `<option value="${y}">${y}</option>`;

    function openCalendar() {
        document.getElementById('calendar-modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        buildCalendar();
    }

    function closeCalendar() {
        document.getElementById('calendar-modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function buildCalendar() {
        const m = parseInt(monthSelect.value);
        const y = parseInt(yearSelect.value);
        const grid = document.getElementById('calendar-days');
        grid.innerHTML = '';

        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();

        // Celdas vacías
        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="cal-day other-month"></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const activeClass = (dateStr === selectedDate) ? 'active' : '';
            grid.innerHTML += `<div class="cal-day ${activeClass}" onclick="selectDate('${dateStr}')">${d}</div>`;
        }
    }

    function selectDate(date) {
        selectedDate = date;
        document.getElementById('selected-date-display').innerText = date;
        if(db[date]) {
            document.getElementById('nativos').value = db[date].n;
            document.getElementById('brasileros').value = db[date].b;
            document.getElementById('zoom').value = db[date].z;
        } else {
            document.getElementById('nativos').value = 0;
            document.getElementById('brasileros').value = 0;
            document.getElementById('zoom').value = 0;
        }
        calc();
        closeCalendar();
    }

    function calc() {
        const n = +document.getElementById('nativos').value || 0;
        const b = +document.getElementById('brasileros').value || 0;
        const z = +document.getElementById('zoom').value || 0;
        document.getElementById('total-val').innerText = n + b + z;
    }

    function save() {
        const total = +document.getElementById('total-val').innerText;
        db[selectedDate] = {
            n: +document.getElementById('nativos').value,
            b: +document.getElementById('brasileros').value,
            z: +document.getElementById('zoom').value,
            total: total
        };
        localStorage.setItem('stats_v3', JSON.stringify(db));
        renderAll();
        alert("Guardado!");
    }

    function deleteEntry(date) {
        if(confirm('¿Borrar?')) { delete db[date]; localStorage.setItem('stats_v3', JSON.stringify(db)); renderAll(); }
    }

    function renderAll() {
        const searchTerm = document.getElementById('search').value;
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = '';

        const keys = Object.keys(db).sort().reverse();
        const filteredKeys = keys.filter(k => k.includes(searchTerm));

        filteredKeys.forEach(k => {
            tbody.innerHTML += `<tr>
                <td>${k}</td>
                <td>${db[k].total}</td>
                <td><button onclick="deleteEntry('${k}')" style="background:red; border:none; color:white; border-radius:4px; cursor:pointer;">X</button></td>
            </tr>`;
        });

        // Gráfica de totales
        const ctx = document.getElementById('chart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: keys.slice(0, 7).reverse(),
                datasets: [{ label: 'Totales', data: keys.slice(0, 7).reverse().map(k => db[k].total), backgroundColor: '#fff' }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#222' } } } }
        });
    }

    // Al iniciar
    monthSelect.value = new Date().getMonth();
    yearSelect.value = new Date().getFullYear();
    selectDate(selectedDate);
    renderAll();

</script>
</body>
</html>
