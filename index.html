<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Master Cloud - Sincronizado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #000; --card: #151515; --accent: #fff; --text: #fff;
            --border: #333; --info: #00d1ff; --warning: #ffcc00;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        
        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .btn-main { 
            width: 100%; padding: 18px; border-radius: 12px; border: none; 
            font-weight: bold; font-size: 1.1rem; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px;
        }
        .btn-date { background: #222; color: white; border: 1px solid var(--border); }
        .btn-save { background: var(--accent); color: black; }
        
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .grid-stats input { 
            width: 100%; padding: 15px; background: #222; border: 1px solid var(--border); 
            border-radius: 10px; color: white; font-size: 1.3rem; text-align: center; box-sizing: border-box;
        }

        .total-display { font-size: 3.5rem; font-weight: bold; text-align: center; margin: 15px 0; color: var(--accent); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1a1a1a; border-radius: 12px; overflow: hidden; }
        th { background: #252525; padding: 12px; text-align: left; font-size: 0.8rem; color: #888; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        
        .tag-week { color: var(--info); border-left: 4px solid var(--info); padding-left: 10px; margin-top: 25px; font-size: 1rem; }
        .tag-weekend { color: var(--warning); border-left: 4px solid var(--warning); padding-left: 10px; margin-top: 25px; font-size: 1rem; }

        /* Estilo para el buscador */
        #dateSearch { width: 100%; padding: 15px; background: #222; border: 1px solid var(--border); color: white; border-radius: 10px; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; letter-spacing: 1px;">CONTROL DE REGISTRO</h2>

    <div class="card">
        <div class="btn-main btn-date">
            📅 <span id="label-fecha">Cargando...</span>
        </div>

        <div class="grid-stats">
            <input type="number" id="in-n" value="0" oninput="recalc()">
            <input type="number" id="in-b" value="0" oninput="recalc()">
            <input type="number" id="in-z" value="0" oninput="recalc()">
        </div>

        <div class="total-display" id="total-view">0</div>
        
        <button class="btn-main btn-save" onclick="saveRecord()">💾 GUARDAR DATOS</button>
    </div>

    <div class="card">
        <input type="text" id="dateSearch" placeholder="🔍 Buscar por fecha (AAAA-MM-DD)..." oninput="renderHistory()">
        
        <h3 class="tag-week">ENTRE SEMANA</h3>
        <table id="tab-week">
            <thead><tr><th>Fecha</th><th>N/B/Z</th><th>Total</th></tr></thead>
            <tbody></tbody>
        </table>

        <h3 class="tag-weekend">FIN DE SEMANA</h3>
        <table id="tab-weekend">
            <thead><tr><th>Fecha</th><th>N/B/Z</th><th>Total</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // CONFIGURACIÓN DE TU FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBW2_C14i_5lw1yeuA0VXhE9brIrpedpEM",
        authDomain: "stats-23446.firebaseapp.com",
        projectId: "stats-23446",
        databaseURL: "https://stats-23446-default-rtdb.firebaseio.com/",
        appId: "1:794246839864:web:7e5102ae64e647a9b8b0cd"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let db = {};
    let selDate = new Date().toISOString().split('T')[0];
    document.getElementById('label-fecha').innerText = selDate;

    // Escuchar la nube en tiempo real
    database.ref('registros/').on('value', (snapshot) => {
        db = snapshot.val() || {};
        renderHistory();
    });

    function recalc() {
        const n = parseInt(document.getElementById('in-n').value) || 0;
        const b = parseInt(document.getElementById('in-b').value) || 0;
        const z = parseInt(document.getElementById('in-z').value) || 0;
        document.getElementById('total-view').innerText = n + b + z;
    }

    function saveRecord() {
        const n = parseInt(document.getElementById('in-n').value) || 0;
        const b = parseInt(document.getElementById('in-b').value) || 0;
        const z = parseInt(document.getElementById('in-z').value) || 0;
        const total = n + b + z;

        const data = { n, b, z, total };

        // Guardar y sincronizar en la nube
        database.ref('registros/' + selDate).set(data)
            .then(() => alert("✅ Datos guardados y sincronizados en todos los dispositivos"))
            .catch(() => alert("❌ Error: Revisa las reglas de tu base de datos en Firebase"));
    }

    function renderHistory() {
        const q = document.getElementById('dateSearch').value;
        const tWeek = document.querySelector('#tab-week tbody');
        const tWEnd = document.querySelector('#tab-weekend tbody');
        
        tWeek.innerHTML = ''; 
        tWEnd.innerHTML = '';
        
        const sortedDates = Object.keys(db).sort().reverse();
        
        sortedDates.filter(d => d.includes(q)).forEach(date => {
            const item = db[date];
            // Identificar si es fin de semana (Sábado=6, Domingo=0)
            const dayNum = new Date(date + "T00:00:00").getDay();
            const isWeekend = (dayNum === 0 || dayNum === 6);
            
            const row = `<tr>
                <td><b>${date}</b></td>
                <td>${item.n}/${item.b}/${item.z}</td>
                <td style="color:var(--accent)"><b>${item.total}</b></td>
            </tr>`;
            
            if(isWeekend) tWEnd.innerHTML += row; 
            else tWeek.innerHTML += row;
        });
    }
</script>
</body>
</html>
